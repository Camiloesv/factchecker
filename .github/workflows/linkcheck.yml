name: Fact-Checker

on:
  pull_request:
    branches:
      - main

jobs:
  link-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Links
        uses: lycheeverse/lychee-action@v2.4.1
        with:
          fail: true
          args: --verbose travel_guide.md
